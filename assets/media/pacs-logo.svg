<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="PACS Lab logo">
  <defs>
    <linearGradient id="pacsRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E31837"/>
      <stop offset="1" stop-color="#a5102a"/>
    </linearGradient>
  </defs>

  <!-- Distributed-systems node emblem -->
  <g fill="none" stroke="url(#pacsRed)" stroke-width="6">
    <line x1="210" y1="60" x2="140" y2="105"/>
    <line x1="210" y1="60" x2="280" y2="105"/>
    <line x1="140" y1="105" x2="210" y2="150"/>
    <line x1="280" y1="105" x2="210" y2="150"/>
    <line x1="140" y1="105" x2="280" y2="105"/>
  </g>
  <g fill="url(#pacsRed)">
    <circle cx="210" cy="60" r="15"/>
    <circle cx="140" cy="105" r="13"/>
    <circle cx="280" cy="105" r="13"/>
    <circle cx="210" cy="150" r="15"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="228" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="76" font-weight="800" letter-spacing="4"
        fill="url(#pacsRed)">PACS</text>
  <text x="210" y="268" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="14"
        fill="#333333">LAB</text>
  <text x="210" y="293" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" letter-spacing="2"
        fill="#777777">YORK UNIVERSITY</text>
</svg>
