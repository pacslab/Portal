# PACS Lab theme
# Light palette matches the NVIDIA AMRI site exactly (white + #dcdcdc sections).
# Links use York University red (#E31837) for brand harmony.
# The day/night toggle switches between the [light] and [dark] palettes.
name = "PACS"

[light]
  # Primary / links — York University red
  primary = "#E31837"
  link = "#E31837"
  link_hover = "#b3122c"

  # Menu (white navbar like NVIDIA)
  menu_primary = "#ffffff"
  menu_text = "#333333"
  menu_text_active = "#E31837"
  menu_title = "#1a1a1a"

  # Home sections — exact NVIDIA AMRI backgrounds
  home_section_odd = "rgb(255, 255, 255)"
  home_section_even = "rgb(220, 220, 220)"

[dark]
  # Primary / links — brightened York red for legibility on dark
  primary = "#ff4d63"
  link = "#ff4d63"
  link_hover = "#ff7385"

  # Menu
  menu_primary = "rgb(13, 15, 20)"
  menu_text = "rgba(255,255,255,0.7)"
  menu_text_active = "#ff4d63"
  menu_title = "#ffffff"

  # Home sections
  home_section_odd = "rgb(17, 19, 26)"
  home_section_even = "rgb(11, 12, 17)"
