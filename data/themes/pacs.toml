# PACS Lab theme
# Dark palette with a #1c1d24 background (requested).
# Links use York University red for brand harmony.
# The day/night toggle switches between the [light] and [dark] palettes.
name = "PACS"

[light]
  # Primary / links — York University red
  primary = "#E31837"
  link = "#E31837"
  link_hover = "#b3122c"

  # Menu (white navbar)
  menu_primary = "#ffffff"
  menu_text = "#333333"
  menu_text_active = "#E31837"
  menu_title = "#1a1a1a"

  # Home sections
  home_section_odd = "rgb(255, 255, 255)"
  home_section_even = "rgb(220, 220, 220)"

[dark]
  # Primary / links — brightened York red for legibility on dark
  primary = "#ff4d63"
  link = "#ff4d63"
  link_hover = "#ff7385"

  # Page background — dark blue-gray #1c1d24
  background = "#1c1d24"
  
  # Menu — matches the #1c1d24 background
  menu_primary = "#1c1d24"
  menu_text = "rgba(255,255,255,0.75)"
  menu_text_active = "#ff4d63"
  menu_title = "#ffffff"

  # Home sections — requested #1c1d24 background
  home_section_odd = "#1c1d24"
  home_section_even = "#1c1d24"
